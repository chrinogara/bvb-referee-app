<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sand-coloured beach volleyball with FIVB navy + orange swirls -->
  <defs>
    <radialGradient id="ball" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1E9DA"/>
    </radialGradient>
  </defs>
  <!-- Ball circle -->
  <circle cx="32" cy="32" r="29" fill="url(#ball)" stroke="#2D3270" stroke-width="2.5"/>
  <!-- Three curved seams (typical beach-volley swirl pattern) -->
  <path d="M 6 24 C 18 16, 28 22, 38 16 S 56 12, 58 22" stroke="#2D3270" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M 6 40 C 18 48, 28 42, 38 48 S 56 52, 58 42" stroke="#2D3270" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M 18 6 C 22 22, 16 32, 22 42 S 26 58, 24 62" stroke="#E85D26" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M 46 6 C 42 22, 48 32, 42 42 S 38 58, 40 62" stroke="#E85D26" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Highlight (matte beach surface) -->
  <ellipse cx="24" cy="22" rx="8" ry="4" fill="#FFFFFF" opacity="0.45"/>
</svg>
